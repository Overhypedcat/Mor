[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mor-helper"
version = "0.1.0"
description = "Mor's helper: the music filter's song finding and the 1440p unlock's VPN asks, for Mor's Firefox extension"
requires-python = ">=3.10"
dependencies = ["streamlink>=8.0", "yt-dlp[default]>=2025.1.1", "av>=14", "numpy>=2", "shazamio>=0.9"]

[tool.setuptools.packages.find]
include = ["mor_helper*"]
